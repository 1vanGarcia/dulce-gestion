const bk=()=>{dl(JSON.stringify({app:'emybake',v:2,fecha:new Date().toISOString(),pedidos:P,catalogo:C}),'copia-emybake-'+iso()+'.json','application/json');localStorage.setItem('dulce_bk',Date.now());toast('Copia lista 💾')};
$('#bBk').onclick=bk;$('#bRe').onclick=()=>$('#fr').click();
$('#fr').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t.replace(/^\ufeff/,''));if(!Array.isArray(d.pedidos))throw 0;let n=0;
 d.pedidos.map(mig).forEach(x=>{x._d=1;const y=P.find(z=>z.id==x.id);if(!y){P.push(x);n++}else if((x.updated_at||'')>(y.updated_at||'')){Object.assign(y,x);n++}});
 if(d.catalogo){C=Object.assign(C,d.catalogo);S('dulce_catalogo',C)}save();render();sync();toast('Copia restaurada: '+n+' pedidos ✅')}catch{toast('Ese archivo no parece una copia válida','error')}e.target.value=''})};
$('#bCsv').onclick=()=>{const r=[['fecha_entrega','hora','cliente','telefono','pedido','ubicacion','total','abono','pago','ganancia','entregado','notas']].concat(P.filter(p=>!p.eliminado_at).map(p=>[p.fecha_entrega,p.hora,p.cliente,p.telefono,res(p),p.ubicacion,tot(p),p.pago=='Pagado'?tot(p):p.abono||0,p.pago,gan(p),p.entregado?'Sí':'No',p.notas]));
 dl(r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'pedidos.csv','text/csv')};
const net=()=>{const c=$('#chip');c.textContent=navigator.onLine?'🟢 En línea':'🟠 Sin conexión · se guarda en tu celular';c.className=navigator.onLine?'':'off'};
addEventListener('online',()=>{est();toast('Conexión recuperada','info');sync()});addEventListener('offline',()=>{est();toast('Sin conexión: todo se guarda en tu celular','warn')});
let sb,st,busy=0,warned=0;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch{}
const pend=()=>P.filter(p=>p._d).length;
function est(t){const c=$('#chip'),o=!navigator.onLine;c.textContent=t||(o?'🟠 Sin conexión · se guarda en tu celular':pend()?'🟠 '+pend()+' por sincronizar':'🟢 En línea · todo guardado');c.className=!t&&(o||pend())?'off':''}
function sync(){clearTimeout(st);st=setTimeout(doSync,400)}
async function doSync(){if(!sb||busy||!navigator.onLine)return est();
 try{const{data:{session}}=await sb.auth.getSession();if(!session){$('#lg').classList.add('on');return est()}}catch{return est()}
 busy=1;est('🔵 Sincronizando…');
 try{if(!localStorage.dulce_sync)P.forEach(p=>p._d=1);
  const up=P.filter(p=>p._d),rows=up.map(p=>({id:p.id,cliente:p.cliente,telefono:p.telefono||null,items:p.items,ubicacion:p.ubicacion||null,abono:p.abono||0,pago:p.pago,entregado:!!p.entregado,fecha_entrega:p.fecha_entrega,hora:p.hora||null,notas:p.notas||null,created_at:p.created_at,updated_at:p.updated_at,eliminado_at:p.eliminado_at||null}));
  if(rows.length){const{error}=await sb.from('pedidos').upsert(rows);if(error)throw error;up.forEach(p=>{if(p.updated_at==rows.find(r=>r.id==p.id).updated_at)delete p._d})}
  const since=localStorage.dulce_sync||'1970-01-01T00:00:00Z',{data,error}=await sb.from('pedidos').select('*').gt('updated_at',since);if(error)throw error;
  let mx=since;data.forEach(r=>{const y=P.find(p=>p.id==r.id),f={...r,abono:+r.abono};if(new Date(r.updated_at)>new Date(mx))mx=r.updated_at;
   if(!y)P.push(mig(f));else if(!y._d&&new Date(r.updated_at)>new Date(y.updated_at))Object.assign(y,f)});
  localStorage.dulce_sync=mx;save();warned=0}
 catch(e){console.warn(e);if(!warned){warned=1;toast(e&&e.code=='42501'?'Tu usuario aún no está autorizado para sincronizar':'No se pudo sincronizar; se reintentará solo','warn')}}
 busy=0;save();render();est()}
$('#lgb').onclick=async()=>{if(!sb)return;const{error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)return toast('Correo o contraseña incorrectos','error');$('#lg').classList.remove('on');toast('¡Bienvenida! 🍰');doSync()};
$('#bOut').onclick=async()=>{if(sb)await sb.auth.signOut();location.reload()};
est();save();render();doSync();setInterval(sync,60000);addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setTimeout(()=>{if(P.length&&Date.now()-(+localStorage.dulce_bk||0)>6048e5)toast('Hace tiempo que no guardas una copia 💾','info','Guardar',bk)},2500);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
